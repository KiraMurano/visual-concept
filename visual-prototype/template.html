<script>
/* ── State: one object, every frame renders from it ─────────────────── */
const STATE = { theme: 'both', items: 3, text: 'short', now: 10 * 60 };

/* One control per variable that changes the answer; options are its extremes.
   A control with `range` becomes a slider; `play` adds a button that walks the range. */
const CONTROLS = [
  { key: 'theme', label: 'Theme', options: [['light', 'Light'], ['dark', 'Dark'], ['both', 'Both']] },
  { key: 'items', label: 'Items', options: [[1, '1'], [3, '3'], [12, '12']] },
  { key: 'text',  label: 'Text',  options: [['short', 'Short'], ['long', 'Longest']] },
  { key: 'now',   label: 'Now',   range: [8 * 60, 20 * 60, 5], format: m => hhmm(m), play: 6000 },
];

const TEXT = { short: 'Room A', long: 'TODO: the longest real value the field allows' };

/* Variants of block 1. Numbers carry lineage: round 2 refines 1.2 as 1.2.1, 1.2.2. */
const VARIANTS = [
  {
    id: '1.1', name: 'TODO name',
    caption: 'Answers: TODO. Costs: TODO.',
    render: s => screen(s, 'list'),
    measure: el => fit(el),
  },
  {
    id: '1.2', name: 'TODO name',
    caption: 'Answers: TODO. Costs: TODO.',
    render: s => screen(s, 'compact'),
    measure: el => fit(el),
  },
];

/* ── Mock: TODO replace with markup copied from the real components ── */
function screen(s, mode) {
  const rows = Array.from({ length: s.items }, (_, i) => {
    const start = 8 * 60 + i * 60;
    const past = start + 60 <= s.now;
    return `<div class="mock-row ${past ? 'is-past' : ''}">${hhmm(start)} · ${TEXT[s.text]}
      ${mode === 'list' ? `<div class="mock-hint">${past ? 'ended' : 'free until ' + hhmm(start + 60)}</div>` : ''}</div>`;
  }).join('');
  return `<div class="mock-body"><p class="mock-title">${TEXT[s.text]}</p>${rows}</div>`;
}

/* Readouts: numbers measured from the rendered DOM, not estimated. */
function fit(el) {
  const screenBox = el.getBoundingClientRect();
  const body = el.firstElementChild;
  const over = Math.round(body.scrollHeight - screenBox.height);
  return over > 0
    ? `Content ${body.scrollHeight}px · <span class="cx-bad">${over}px off-screen</span>`
    : `Content ${body.scrollHeight}px · fits, ${-over}px spare`;
}

/* ── Scaffold ───────────────────────────────────────────────────────── */
function hhmm(m) { return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; }

let playing = null;
function renderControls() {
  const bar = document.getElementById('cx-controls');
  bar.innerHTML = '';
  for (const c of CONTROLS) {
    const wrap = document.createElement('div');
    wrap.className = 'cx-control';
    wrap.innerHTML = `<span>${c.label}</span>`;
    if (c.range) {
      const [min, max, step] = c.range;
      const input = Object.assign(document.createElement('input'), { type: 'range', min, max, step, value: STATE[c.key] });
      const out = document.createElement('output');
      out.textContent = c.format ? c.format(STATE[c.key]) : STATE[c.key];
      input.oninput = () => { STATE[c.key] = +input.value; out.textContent = c.format ? c.format(+input.value) : input.value; render(); };
      wrap.append(input, out);
      if (c.play) {
        const btn = document.createElement('button');
        btn.textContent = '▶';
        btn.onclick = () => play(c, input, out, btn);
        wrap.append(btn);
      }
    } else {
      for (const [value, text] of c.options) {
        const btn = document.createElement('button');
        btn.textContent = text;
        btn.setAttribute('aria-pressed', String(STATE[c.key] === value));
        btn.onclick = () => { STATE[c.key] = value; renderControls(); render(); };
        wrap.append(btn);
      }
    }
    bar.append(wrap);
  }
}

function play(c, input, out, btn) {
  if (playing) { cancelAnimationFrame(playing); playing = null; btn.textContent = '▶'; return; }
  const [min, max] = c.range;
  const t0 = performance.now();
  btn.textContent = '❚❚';
  const tick = t => {
    const k = Math.min(1, (t - t0) / c.play);
    const step = c.range[2];
    STATE[c.key] = Math.round((min + (max - min) * k) / step) * step;
    input.value = STATE[c.key];
    out.textContent = c.format ? c.format(STATE[c.key]) : STATE[c.key];
    render();
    if (k < 1) playing = requestAnimationFrame(tick); else { playing = null; btn.textContent = '▶'; }
  };
  playing = requestAnimationFrame(tick);
}

function render() {
  const themes = STATE.theme === 'both' ? ['light', 'dark'] : [STATE.theme];
  const host = document.querySelector('#cx-block-1 .cx-frames');
  host.innerHTML = VARIANTS.map(v => `
    <div class="cx-variant">
      <h3>${v.id} ${v.name}</h3>
      <p class="cx-caption">${v.caption}</p>
      <div class="cx-pair">${themes.map(th => `
        <div class="cx-frame">
          ${themes.length > 1 ? `<span class="cx-theme-label">${th}</span>` : ''}
          <div class="cx-screen cx-${th}" data-variant="${v.id}">${v.render(STATE)}</div>
          <div class="cx-readout"></div>
        </div>`).join('')}
      </div>
    </div>`).join('');
  requestAnimationFrame(() => {
    for (const frame of host.querySelectorAll('.cx-frame')) {
      const el = frame.querySelector('.cx-screen');
      const v = VARIANTS.find(x => x.id === el.dataset.variant);
      frame.querySelector('.cx-readout').innerHTML = v.measure(el);
    }
  });
}

renderControls();
document.fonts.ready.then(render); /* measuring before fonts load gives plausible wrong numbers */
</script>
